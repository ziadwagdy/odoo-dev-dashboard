<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#714B67" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Odoo Dev Dashboard</title>
  <!-- Apply theme before first paint to avoid flash of wrong theme -->
  <script>
    (function() {
      var choice = localStorage.getItem('theme') || 'system';
      var resolved = choice === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : choice;
      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-bg text-slate-200">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
